name: daily-forecast

on:
  schedule:
    - cron: "0 14 * * *"  # 7am Pacific
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/forecast.py
      - name: Commit forecast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/forecast data/processed/ndvi.parquet
          git diff --cached --quiet || git commit -m "Daily forecast $(date -u +%F)"
          git push
